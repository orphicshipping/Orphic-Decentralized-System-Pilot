name: Link scalar Linux developer-kit software
on:
  pull_request:
    paths:
      - 'src/ciw/link*.py'
      - 'src/ciw/engineering_thread*.py'
      - 'src/ciw/production*.py'
      - 'tests/test_engineering_thread.py'
      - 'tests/test_engineering_continuity.py'
      - 'docs/ENGINEERING_CONTINUITY.md'
      - 'docs/ENGINEERING_INTENT.md'
      - 'src/ciw/mount_characterization.py'
      - 'tests/test_mount_characterization.py'
      - 'docs/LINK_INSTALLATION.md'
      - 'src/ciw/operations/**'
      - 'tests/test_link*.py'
      - 'tests/test_connectivity.py'
      - 'scripts/check_link_installation.py'
      - 'scripts/provision_link_environment.py'
      - 'tests/test_link_offline_environment.py'
      - 'docs/LINK_OFFLINE_DEPLOYMENT.md'
      - 'pyproject.toml'
      - 'docs/GAUGELINK_DELIVERY.md'
      - 'docs/LINK_UNIFIED.md'
      - 'docs/GAUGELINK_SCIENTIFIC_GUARDS.md'
      - '.github/workflows/link-scalar-study.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scalar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install 'setuptools>=77' wheel '.[dev,legibility]'
      - env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_link_study.py tests/test_link.py tests/test_connectivity.py tests/test_link_delivery.py tests/test_link_inspection.py tests/test_link_ingress_recovery.py tests/test_link_scientific_guards.py tests/test_link_snapshot_integrity.py tests/test_link_unification.py tests/test_mount_characterization.py tests/test_link_installation.py tests/test_engineering_thread.py tests/test_engineering_continuity.py tests/test_link_offline_environment.py --junitxml=source-tests.xml
      - run: python -m pip wheel --no-deps --no-build-isolation . --wheel-dir dist
      - name: Installed bytes, native codec, real PTY and MCP stdio
        shell: bash
        run: |
          set -euo pipefail
          wheel=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          # Online package acquisition is explicit in CI, never in provisioning.
          python -m pip download --only-binary=:all: --dest "$RUNNER_TEMP/link-wheels" "$wheel[dev,legibility]"
          project_ref=$(python -c 'import hashlib; print("sha256:"+hashlib.sha256(open("pyproject.toml","rb").read()).hexdigest())')
          root_ref=$(python -c 'import hashlib,sys; print("sha256:"+hashlib.sha256(open(sys.argv[1],"rb").read()).hexdigest())' "$wheel")
          python scripts/provision_link_environment.py prepare --project pyproject.toml --project-ref "$project_ref" --root-ref "$root_ref" --wheelhouse "$RUNNER_TEMP/link-wheels" --profile qualification --output "$RUNNER_TEMP/link-offline-bundle" > "$RUNNER_TEMP/link-offline-prepared.json"
          manifest_ref=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["manifest_ref"])' "$RUNNER_TEMP/link-offline-prepared.json")
          python scripts/provision_link_environment.py provision "$RUNNER_TEMP/link-offline-bundle" --manifest-ref "$manifest_ref" --allow-install --output "$RUNNER_TEMP/link-provisioned" > "$RUNNER_TEMP/link-provisioned.json"
          "$RUNNER_TEMP/link-provisioned/env/bin/python" scripts/check_link_installation.py --wheel "$wheel" --output-dir "$RUNNER_TEMP/link-scalar" --require-pins --with-scalar-study --with-delivery --with-installation --with-engineering
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: link-scalar-${{ matrix.python }}
          path: |
            source-tests.xml
            dist/*.whl
            ${{ runner.temp }}/link-offline-prepared.json
            ${{ runner.temp }}/link-offline-bundle/manifest.json
            ${{ runner.temp }}/link-offline-bundle/requirements.txt
            ${{ runner.temp }}/link-provisioned.json
            ${{ runner.temp }}/link-provisioned/*.log
            ${{ runner.temp }}/link-scalar/summary.json
            ${{ runner.temp }}/link-scalar/installed-tests.xml
          retention-days: 14
