name: NET ALCHEMI bounded adapter
on:
  pull_request:
    paths:
      - 'src/ciw/nvalchemi*.py'
      - 'src/ciw/operations/runner.py'
      - 'src/ciw/adapters/subprocess.py'
      - 'tests/test_nvalchemi*.py'
      - 'scripts/check_nvalchemi.py'
      - '.github/workflows/net-nvalchemi.yml'
  push:
    branches: [main]
    paths:
      - 'src/ciw/nvalchemi*.py'
      - 'tests/test_nvalchemi*.py'
      - 'src/ciw/operations/runner.py'
      - '.github/workflows/net-nvalchemi.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provider-free:
    name: Provider-free contracts and retained lifecycle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/test_nvalchemi_contract.py tests/test_nvalchemi_worker.py tests/test_nvalchemi_lifecycle.py tests/test_operation_runner.py
      - name: Record scope
        shell: bash
        run: echo 'Provider-free tests only. Native ALCHEMI CPU/CUDA qualification is NOT_RUN; no scientific or physical qualification is implied.' >> "$GITHUB_STEP_SUMMARY"
