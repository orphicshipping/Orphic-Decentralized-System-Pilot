name: Consolidated integration
on:
  pull_request:
  push:
    branches: [main, 'release/**']
    tags: ['**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install common and local DSP dependencies
        run: |
          python -m pip install -e '.[dev,external-work,legibility,particles,numerical-checks,bench-models]' build
          python -m pip install --no-deps -e instruments/measurement/signal-processing -e instruments/measurement/signal-conditioning
      - name: Check retained source ancestry and exact imported bytes
        run: python scripts/monorepo.py > retained-source-audit.json
      - name: Check packaged integration declarations
        run: python scripts/update_integration_sources.py --check
      - name: Run all regression modules with isolated provider state
        run: python scripts/check_consolidated.py --output-dir consolidated-results
      - name: Retain complete results, including skips and refusals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consolidated-regression
          path: |
            retained-source-audit.json
            consolidated-results/
          if-no-files-found: error
