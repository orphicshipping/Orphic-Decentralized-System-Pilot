name: Link retained measurement views

on:
  pull_request:
    paths:
      - 'src/ciw/**'
      - 'tests/test_link*.py'
      - 'tests/test_connectivity.py'
      - 'scripts/check_link_installation.py'
      - 'pyproject.toml'
      - '.github/workflows/link-measurements.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installed:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install 'setuptools>=77' wheel '.[dev,legibility,columnar]'
      - run: python -m pip wheel --no-deps --no-build-isolation . --wheel-dir dist
      - name: Installed source-bound core gate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_link_installation.py --wheel dist/*.whl --output-dir "$RUNNER_TEMP/measurement-installed" --with-measurements --require-pins
      - name: Actual Parquet export and recovery
        env:
          NET_MEASUREMENT_PARQUET: '1'
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python -m pytest -q tests/test_link_measurement_parquet.py --junitxml=parquet.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: link-measurements-${{ matrix.python }}
          path: |
            ${{ runner.temp }}/measurement-installed/summary.json
            ${{ runner.temp }}/measurement-installed/installed-tests.xml
            ${{ runner.temp }}/measurement-installed/*.log
            parquet.xml
