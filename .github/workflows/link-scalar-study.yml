name: Link scalar Linux developer-kit software
on:
  pull_request:
    paths:
      - 'src/ciw/link*.py'
      - 'src/ciw/engineering_thread*.py'
      - 'src/ciw/production*.py'
      - 'tests/test_engineering_thread.py'
      - 'docs/ENGINEERING_INTENT.md'
      - 'src/ciw/mount_characterization.py'
      - 'tests/test_mount_characterization.py'
      - 'docs/LINK_INSTALLATION.md'
      - 'src/ciw/operations/**'
      - 'tests/test_link*.py'
      - 'tests/test_connectivity.py'
      - 'scripts/check_link_installation.py'
      - 'pyproject.toml'
      - 'docs/GAUGELINK_DELIVERY.md'
      - 'docs/LINK_UNIFIED.md'
      - 'docs/GAUGELINK_SCIENTIFIC_GUARDS.md'
      - '.github/workflows/link-scalar-study.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scalar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install 'setuptools>=77' wheel '.[dev,legibility]'
      - env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_link_study.py tests/test_link.py tests/test_connectivity.py tests/test_link_delivery.py tests/test_link_inspection.py tests/test_link_ingress_recovery.py tests/test_link_scientific_guards.py tests/test_link_snapshot_integrity.py tests/test_link_unification.py tests/test_mount_characterization.py tests/test_link_installation.py tests/test_engineering_thread.py --junitxml=source-tests.xml
      - run: python -m pip wheel --no-deps --no-build-isolation . --wheel-dir dist
      - name: Installed bytes, native codec, real PTY and MCP stdio
        shell: bash
        run: |
          set -euo pipefail
          wheel=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          python scripts/check_link_installation.py --wheel "$wheel" --output-dir "$RUNNER_TEMP/link-scalar" --require-pins --with-scalar-study --with-delivery --with-installation --with-engineering
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: link-scalar-${{ matrix.python }}
          path: |
            source-tests.xml
            dist/*.whl
            ${{ runner.temp }}/link-scalar/summary.json
            ${{ runner.temp }}/link-scalar/installed-tests.xml
          retention-days: 14
