name: Sequence kinetics reference integration
on:
  pull_request:
    paths:
      - 'src/ciw/sequence_*.py'
      - 'src/ciw/polymer_cli.py'
      - 'src/ciw/session.py'
      - 'src/ciw/operations/**'
      - 'src/ciw/core/**'
      - 'tests/test_sequence_*.py'
      - 'scripts/check_sequence_reference.py'
      - '.github/workflows/sequence-kinetics.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sequence:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[dev,numerical-checks]'
      - run: python -m unittest discover -s tests -p 'test_sequence_*.py' -v
      - run: python scripts/check_sequence_reference.py --output sequence-reference-audit.json
      - name: Installed native CLI outside checkout
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          net polymer sequence example --output sequence-request.json
          net polymer sequence run sequence-request.json --output-dir sequence-original
          net polymer sequence inspect sequence-original
          net polymer sequence replay sequence-original --output-dir sequence-replay
      - name: Retain reference audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sequence-reference-${{ matrix.os }}-${{ matrix.python }}
          path: sequence-reference-audit.json
          if-no-files-found: warn
