name: Thermal identification and Model-Reality contracts

on:
  pull_request:
    paths:
      - 'src/ciw/**'
      - 'tests/test_thermal_identification.py'
      - 'tests/test_thermal_experiment.py'
      - 'tests/test_polymer_workflow.py'
      - 'tests/test_polymer_metrology.py'
      - 'pyproject.toml'
      - '.github/workflows/thermal-identification.yml'
  push:
    branches: [main]
    paths:
      - 'src/ciw/**'
      - 'tests/test_thermal_identification.py'
      - 'tests/test_thermal_experiment.py'
      - 'pyproject.toml'
      - '.github/workflows/thermal-identification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bounded-identification:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Preserve source bytes on Windows
        if: runner.os == 'Windows'
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned project and test dependencies
        run: python -m pip install ".[dev]"
      - name: Source contracts and existing polymer regressions
        run: python -m pytest -q tests/test_thermal_identification.py tests/test_thermal_experiment.py tests/test_polymer_workflow.py tests/test_polymer_metrology.py --junitxml=thermal-source-tests.xml
      - name: Build and reinstall the wheel without source-path fallback
        shell: bash
        run: |
          python -m pip wheel . --no-deps --wheel-dir thermal-dist
          python -m pip install --force-reinstall --no-deps thermal-dist/*.whl
      - name: Installed-wheel tests
        run: python -m pytest -q -o pythonpath= tests/test_thermal_identification.py tests/test_thermal_experiment.py --junitxml=thermal-installed-tests.xml
      - name: Installed CLI with outside-checkout working directory
        working-directory: ${{ runner.temp }}
        run: |
          net polymer identify demo --output-dir thermal-installed-demo
          net polymer identify inspect thermal-installed-demo
          net polymer identify replay thermal-installed-demo --output-dir thermal-installed-replay
          net polymer identify experiment example thermal-installed-demo --output thermal-experiment.json
          net polymer identify experiment run thermal-experiment.json --output-dir thermal-experiment-run
          net polymer identify experiment inspect thermal-experiment-run
          net polymer identify experiment replay thermal-experiment-run --output-dir thermal-experiment-replay
      - name: Retain test and run evidence, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: thermal-identification-${{ matrix.os }}-python-${{ matrix.python }}
          path: |
            thermal-*-tests.xml
            ${{ runner.temp }}/thermal-installed-demo/**
            ${{ runner.temp }}/thermal-installed-replay/**
            ${{ runner.temp }}/thermal-experiment.json
            ${{ runner.temp }}/thermal-experiment-run/**
            ${{ runner.temp }}/thermal-experiment-replay/**
          if-no-files-found: warn
          retention-days: 14
