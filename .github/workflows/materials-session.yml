name: Materials Session execution

on:
  pull_request:
    paths:
      - 'src/ciw/materials_*.py'
      - 'src/ciw/rheology_empirical.py'
      - 'src/ciw/operations/**'
      - 'src/ciw/operator_commands.py'
      - 'src/ciw/operator_examples/materials-*.json'
      - 'tests/test_materials_*.py'
      - 'tests/test_rheology_empirical.py'
      - 'pyproject.toml'
      - '.github/workflows/materials-session.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installed-materials:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - name: Preserve Windows source bytes
        if: runner.os == 'Windows'
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Install noneditable candidate and existing pinned dependencies
        run: python -m pip install ".[dev,numerical-checks]"
      - name: Test installed package without source import fallback
        working-directory: ${{ runner.temp }}
        run: >-
          python -m pytest -q -o pythonpath=
          "${{ github.workspace }}/tests/test_thermochemical_benchmark.py"
          "${{ github.workspace }}/tests/test_polymer_viscoelastic.py"
          "${{ github.workspace }}/tests/test_polymer_population.py"
          "${{ github.workspace }}/tests/test_materials_bench.py"
          "${{ github.workspace }}/tests/test_rheology_empirical.py"
          "${{ github.workspace }}/tests/test_materials_workflow.py"
          "${{ github.workspace }}/tests/test_materials_uncertainty.py"
          --junitxml=materials-session-tests.xml
      - name: Installed entrypoint outside checkout
        working-directory: ${{ runner.temp }}
        run: net materials inventory
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: materials-session-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/materials-session-tests.xml
          if-no-files-found: error
          retention-days: 14
