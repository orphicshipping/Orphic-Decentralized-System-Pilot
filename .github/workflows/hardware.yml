name: Qualified hardware refurbishment workflow
on:
  push:
    branches: [main]
    tags: ['**']
    paths-ignore:
      - 'README.md'
      - 'docs/**/*.md'
      - 'deploy/**/*.md'
      - 'godot/**/*.md'
      - 'examples/**/README.md'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'docs/**/*.md'
      - 'deploy/**/*.md'
      - 'godot/**/*.md'
      - 'examples/**/README.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: true
jobs:
  qualification:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]' build
      - name: Hardware lifecycle and shared operation, session and catalogue contracts
        shell: bash
        run: python -m pytest -q tests/test_hardware*.py tests/test_protocol.py tests/test_operation_runner.py tests/test_operation_contract_enforcement.py tests/test_operation_failure_retention.py tests/test_operation_publication.py tests/test_correction_session.py tests/test_operator_catalog.py tests/test_scientific_audit.py --junitxml=hardware-tests.xml
      - name: Require complete qualification
        shell: bash
        run: |
          python - <<'PYTHON'
          import json, platform, subprocess, sys
          import xml.etree.ElementTree as E
          from pathlib import Path
          suites = list(E.parse('hardware-tests.xml').getroot().iter('testsuite'))
          count = sum(int(s.attrib['tests']) for s in suites)
          assert count > 0
          assert all(int(s.attrib[k]) == 0 for s in suites for k in ('failures', 'errors', 'skipped'))
          Path('hardware-qualification.json').write_text(json.dumps({
            'source_commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
            'source_tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
            'python': sys.version, 'platform': platform.platform(), 'tests': count,
            'failures': 0, 'errors': 0, 'skipped': 0,
            'physical_validation': 'not_established', 'release_authorization': 'not_granted'
          }, indent=2), encoding='utf-8')
          PYTHON
          python scripts/check_ci_policy.py
          git diff --check
      - run: python -m build --wheel
      - name: Installed wheel lifecycle outside source checkout
        shell: bash
        run: |
          HARDWARE_VENV="$(python -c 'import os; from pathlib import Path; print((Path(os.environ["RUNNER_TEMP"]) / "installed-hardware").as_posix())')"
          python -m venv "$HARDWARE_VENV"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            HARDWARE_PYTHON="$HARDWARE_VENV/Scripts/python.exe"
            HARDWARE_NET="$HARDWARE_VENV/Scripts/net.exe"
          else
            HARDWARE_PYTHON="$HARDWARE_VENV/bin/python"
            HARDWARE_NET="$HARDWARE_VENV/bin/net"
          fi
          "$HARDWARE_PYTHON" -m pip install dist/*.whl
          "$HARDWARE_PYTHON" -I scripts/check_hardware_installed.py --python "$HARDWARE_PYTHON" --net "$HARDWARE_NET" --wheel dist/*.whl --output-dir "$RUNNER_TEMP/installed-hardware-smoke"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hardware-${{ matrix.os }}-${{ matrix.python }}
          path: |
            hardware-tests.xml
            hardware-qualification.json
            ${{ runner.temp }}/installed-hardware-smoke/**
            dist/*.whl
          if-no-files-found: error
          retention-days: 14
