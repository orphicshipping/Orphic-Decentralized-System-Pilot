name: Manufacturing planning search and co-design
on:
  pull_request:
    paths:
      - 'src/ciw/sensor_manufacturing*.py'
      - 'src/ciw/sensor_project*.py'
      - 'tests/test_sensor_manufacturing*.py'
      - 'tests/test_sensor_project.py'
      - 'scripts/check_manufacturing_analysis_installed.py'
      - '.github/workflows/manufacturing-analysis.yml'
      - 'pyproject.toml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Provision unchanged pins in a separate environment
        shell: python
        run: |
          import pathlib, subprocess, sys, venv
          venv.EnvBuilder(with_pip=True).create('.planning-venv')
          python = str(pathlib.Path('.planning-venv/bin/python').resolve())
          subprocess.run([python,'-m','pip','install','.[dev]','setuptools>=77','wheel'],check=True)
      - name: Source tests and noneditable installed qualification
        shell: python
        run: |
          import os, pathlib, subprocess
          python = str(pathlib.Path('.planning-venv/bin/python').resolve())
          env = dict(os.environ, PYTHONPATH=str(pathlib.Path('src').resolve()), PYTEST_DISABLE_PLUGIN_AUTOLOAD='1')
          subprocess.run([python,'-m','pytest','-q','tests/test_sensor_project.py',
            'tests/test_sensor_manufacturing.py','tests/test_sensor_manufacturing_analysis.py',
            'tests/test_sensor_manufacturing_timing.py',
            '--junitxml=planning-source.xml'],env=env,check=True)
          subprocess.run([python,'-m','pip','wheel','--no-deps','--no-build-isolation','.',
            '--wheel-dir','planning-dist'],check=True)
          wheel = next(pathlib.Path('planning-dist').glob('*.whl')).resolve()
          subprocess.run([python,'-m','pip','install','--no-deps','--force-reinstall',str(wheel)],check=True)
          subprocess.run([python,'scripts/check_manufacturing_analysis_installed.py',
            '--wheel',str(wheel),'--output-dir','planning-installed'],check=True)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manufacturing-planning-${{ matrix.python }}
          path: |
            planning-source.xml
            planning-installed/summary.json
            planning-installed/installed.xml
            planning-installed/tests.log
          if-no-files-found: error
