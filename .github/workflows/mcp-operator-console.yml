name: Local MCP operator console
on:
  push:
    branches: [main]
    paths: ['tools/mcp-operator-console/**', 'src/ciw/**', 'pyproject.toml', '.github/workflows/mcp-operator-console.yml']
  pull_request:
    paths: ['tools/mcp-operator-console/**', 'src/ciw/**', 'pyproject.toml', '.github/workflows/mcp-operator-console.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: true
jobs:
  console:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Install candidate host and pinned console dependencies
        run: python -m pip install . -r tools/mcp-operator-console/requirements.txt
      - name: Exercise real HTTP and MCP subprocess journeys
        run: python -m unittest discover -s tools/mcp-operator-console/tests -p test_console.py -v
      - name: Install locked DOM dependencies
        working-directory: tools/mcp-operator-console
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Exercise DOM security and confirmation behavior
        working-directory: tools/mcp-operator-console
        run: npm test
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install candidate host, console and browser test runtime
        run: python -m pip install . -r tools/mcp-operator-console/requirements.txt playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - name: Exercise browser through HTTP and MCP to retained execution
        run: python tools/mcp-operator-console/tests/browser_journey.py --output-dir results/console-browser
      - name: Retain browser result and sanitized diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: console-browser
          path: |
            results/console-browser/report.json
            results/console-browser/http.log
            results/console-browser/state/events.jsonl
            results/console-browser/state/server-stderr.log
          if-no-files-found: error
