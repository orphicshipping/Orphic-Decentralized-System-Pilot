name: Graph-first Industrial Lab
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: industrial-lab-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  source-and-installed:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_industrial_lab.py --junitxml=results/lab-source.xml
      - run: python -m pip wheel --no-deps . --wheel-dir dist-lab
      - name: Noneditable installed tests outside checkout
        shell: python {0}
        run: |
          import os, pathlib, shutil, subprocess, sys, tempfile
          root = pathlib.Path.cwd()
          wheels = list((root / "dist-lab").glob("*.whl"))
          assert len(wheels) == 1
          subprocess.run([sys.executable, "-m", "pip", "install", "--force-reinstall", "--no-deps", str(wheels[0])], check=True)
          dest = pathlib.Path(tempfile.mkdtemp(prefix="net-lab-installed-"))
          shutil.copy2(root / "tests/test_industrial_lab.py", dest)
          env = dict(os.environ)
          env.pop("PYTHONPATH", None)
          subprocess.run([sys.executable, "-I", "-m", "pytest", "-q", "test_industrial_lab.py", "--junitxml=" + str(root / "results/lab-installed.xml")], cwd=dest, env=env, check=True)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: industrial-lab-${{ matrix.os }}-${{ matrix.python }}
          path: |
            results/lab-*.xml
            dist-lab/*.whl
          if-no-files-found: error
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]" playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/check_industrial_lab_browser.py --output-dir results/lab-browser
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: industrial-lab-browser
          path: results/lab-browser
          if-no-files-found: error
