name: Optional uncertainty providers
on:
  pull_request:
    paths:
      - 'src/ciw/uncertainty_providers.py'
      - 'src/ciw/link_*.py'
      - 'src/ciw/calibration_status.py'
      - 'src/ciw/control_contracts.py'
      - 'src/ciw/core/covariance.py'
      - 'src/ciw/core/identities.py'
      - 'tests/test_uncertainty_providers.py'
      - 'scripts/check_uncertainty_providers.py'
      - 'scripts/retain_uncertainty_provider_environment.py'
      - 'requirements/uncertainty-providers-windows-py312.lock'
      - 'docs/UNCERTAINTY_PROVIDERS.md'
      - 'pyproject.toml'
      - '.github/workflows/uncertainty-providers.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  qualify-installed:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          architecture: x64
      - name: Build the candidate NCP wheel
        run: |
          python -m pip install build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m build --wheel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Provision the hash-locked provider environment
        run: |
          $providerEnv = Join-Path $env:RUNNER_TEMP 'uncertainty-provider-env'
          python -m venv $providerEnv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $providerPython = Join-Path $providerEnv 'Scripts/python.exe'
          & $providerPython -m pip install --require-hashes --only-binary=:all: -r requirements/uncertainty-providers-windows-py312.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wheels = @(Get-ChildItem -LiteralPath dist -Filter '*.whl')
          if ($wheels.Count -ne 1) { throw 'Require one candidate NCP wheel' }
          & $providerPython -m pip install --no-deps $wheels[0].FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Qualify installed providers and retain six real CLI journeys
        run: |
          $providerPython = Join-Path $env:RUNNER_TEMP 'uncertainty-provider-env/Scripts/python.exe'
          $qualifier = Join-Path $env:GITHUB_WORKSPACE 'scripts/check_uncertainty_providers.py'
          $receipts = Join-Path $env:GITHUB_WORKSPACE 'uncertainty-provider-receipts'
          $env:PYTHONPATH = ''
          Set-Location -LiteralPath $env:RUNNER_TEMP
          & $providerPython -I $qualifier --installed --output-dir $receipts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $result = Get-Content -LiteralPath (Join-Path $receipts 'qualification.json') -Raw | ConvertFrom-Json
          if ($result.status -ne 'PASS' -or $result.test_counts.tests -lt 44 -or $result.test_counts.skipped -ne 0 -or $result.test_counts.failures -ne 0 -or $result.test_counts.errors -ne 0 -or $result.cli_calls.Count -ne 6) {
            throw 'Require the complete passing installed provider slice with no skipped tests'
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: uncertainty-providers-windows-py312
          if-no-files-found: error
          path: |
            uncertainty-provider-receipts/
            requirements/uncertainty-providers-windows-py312.lock
            dist/*.whl
