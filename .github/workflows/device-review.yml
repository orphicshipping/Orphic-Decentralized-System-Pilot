name: Retained device review
on:
  pull_request:
    paths:
      - 'src/ciw/device_review*.py'
      - 'tests/test_device_review.py'
      - '.github/workflows/device-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retained-review:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install exact repository dependencies
        run: python -m pip install ".[dev]" "setuptools>=77" wheel
      - name: Source tests
        run: python -m pytest -q tests/test_device_review.py --junitxml=review-source.xml
      - name: Build noneditable wheel
        run: python -m pip wheel --no-deps --no-build-isolation . --wheel-dir dist
      - name: Reinstall wheel and stage outside-checkout tests
        shell: python
        run: |
          import pathlib, shutil, subprocess, sys, tempfile
          wheel = next(pathlib.Path('dist').glob('*.whl'))
          subprocess.run([sys.executable, '-m', 'pip', 'install', '--no-deps', '--force-reinstall', str(wheel)], check=True)
          destination = pathlib.Path(tempfile.mkdtemp(prefix='net-device-review-'))
          shutil.copy('tests/test_device_review.py', destination / 'test_device_review.py')
          (destination / 'pytest.ini').write_text('[pytest]\n')
          subprocess.run([sys.executable, '-I', '-c', 'import ciw,pathlib,sys; assert pathlib.Path(ciw.__file__).resolve().is_relative_to(pathlib.Path(sys.prefix).resolve())'], cwd=destination, check=True)
          subprocess.run([sys.executable, '-I', '-m', 'pytest', '-q', '-c', 'pytest.ini', 'test_device_review.py', '--junitxml=installed.xml'], cwd=destination, check=True)
          shutil.copy(destination / 'installed.xml', 'review-installed.xml')
      - name: Require all focused cases, without skips
        shell: python
        run: |
          import xml.etree.ElementTree as ET
          for name in ('review-source.xml', 'review-installed.xml'):
              suites = list(ET.parse(name).getroot().iter('testsuite'))
              assert sum(int(s.get('tests',0)) for s in suites) == 74
              assert not any(int(s.get(k,0)) for s in suites for k in ('failures','errors','skipped'))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retained-device-review-${{ matrix.os }}-${{ matrix.python }}
          path: review-*.xml
          if-no-files-found: error
