name: Bounded metrology contract
on:
  pull_request:
    paths:
      - 'src/ciw/metrology_contract.py'
      - 'src/ciw/metrology_ingress.py'
      - 'tests/test_metrology_contract.py'
      - 'examples/metrology-sampled/**'
      - '.github/workflows/metrology-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[dev]'
      - run: python -m pytest -q tests/test_metrology_contract.py
      - run: python -m pip wheel --no-deps . -w dist
