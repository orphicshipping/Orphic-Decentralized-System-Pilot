name: NET ALCHEMI bounded adapter
on:
  pull_request:
    paths:
      - 'src/ciw/nvalchemi*.py'
      - 'src/ciw/operations/runner.py'
      - 'src/ciw/adapters/subprocess.py'
      - 'tests/test_nvalchemi*.py'
      - 'scripts/check_nvalchemi.py'
      - 'scripts/check_atomic_nvalchemi.py'
      - 'scripts/prepare_atomic_nvalchemi.py'
      - 'tests/test_atomic_nvalchemi_gate.py'
      - 'runtimes/atomic-alchemi/**'
      - '.github/workflows/net-nvalchemi.yml'
  push:
    branches: [main]
    paths:
      - 'src/ciw/nvalchemi*.py'
      - 'tests/test_nvalchemi*.py'
      - 'src/ciw/operations/runner.py'
      - '.github/workflows/net-nvalchemi.yml'
      - 'scripts/check_atomic_nvalchemi.py'
      - 'scripts/prepare_atomic_nvalchemi.py'
      - 'tests/test_atomic_nvalchemi_gate.py'
      - 'runtimes/atomic-alchemi/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provider-free:
    name: Provider-free contracts and retained lifecycle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/test_nvalchemi_contract.py tests/test_nvalchemi_worker.py tests/test_nvalchemi_lifecycle.py tests/test_atomic_nvalchemi_gate.py tests/test_operation_runner.py
      - name: Record scope
        shell: bash
        run: echo 'Provider-free tests only. Native ALCHEMI CPU/CUDA qualification is NOT_RUN; no scientific or physical qualification is implied.' >> "$GITHUB_STEP_SUMMARY"
  atomic-native-cpu:
    name: Atomic Session native CPU gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Provision the separate pinned atomic CPU environment
        run: |
          python -m pip install -r runtimes/atomic-alchemi/requirements-linux-cpu.txt
          python -m pip install --no-deps .
          python -m pip check
      - name: Bind a complete clean checkout and run every native case
        shell: bash
        run: |
          revision=$(git rev-parse HEAD)
          git worktree add --detach "$RUNNER_TEMP/atomic-source" "$revision"
          python "$RUNNER_TEMP/atomic-source/scripts/prepare_atomic_nvalchemi.py" --repository "$RUNNER_TEMP/atomic-source" --revision "$revision" --python "$(command -v python)" --device cpu --output "$RUNNER_TEMP/atomic-binding.json"
          python "$RUNNER_TEMP/atomic-source/scripts/check_atomic_nvalchemi.py" --binding "$RUNNER_TEMP/atomic-binding.json" --output-dir atomic-native-evidence
      - name: Retain the exact CPU binding and dependency inventory
        if: always()
        shell: bash
        run: |
          git rev-parse HEAD > atomic-source-commit.txt
          python -m pip freeze > atomic-environment.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: atomic-alchemi-native-cpu
          path: |
            atomic-native-evidence
            atomic-source-commit.txt
            atomic-environment.txt
            ${{ runner.temp }}/atomic-binding.json
          if-no-files-found: error
