name: Connectivity retained observation boundary

on:
  pull_request:
    paths:
      - 'src/ciw/**'
      - 'tests/test_connectivity.py'
      - 'scripts/check_connectivity_installation.py'
      - 'pyproject.toml'
      - '.github/workflows/connectivity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connectivity:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[dev]" wheel
      - run: python -m pytest -q tests/test_connectivity.py --junitxml=connectivity-source.xml
      - run: python -m pip wheel --no-deps . --wheel-dir connectivity-dist
      - name: Noneditable installed gate and exact package provenance
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_connectivity_installation.py --require-pins \
            --wheel connectivity-dist/computational_instrumentation_workbench-0.1.0-py3-none-any.whl \
            --output-dir "$RUNNER_TEMP/connectivity-installed"
      - name: Existing installed first-use regression
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          net start --output-dir connectivity-existing-start
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: connectivity-${{ matrix.os }}-${{ matrix.python }}
          path: |
            connectivity-source.xml
            ${{ runner.temp }}/connectivity-installed/*.json
            ${{ runner.temp }}/connectivity-installed/*.log
            ${{ runner.temp }}/connectivity-installed/*.xml
            ${{ runner.temp }}/connectivity-existing-start/*.json
