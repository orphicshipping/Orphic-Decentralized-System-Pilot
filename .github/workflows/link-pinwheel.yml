name: Link covariance improvement review
on:
  pull_request:
    paths:
      - 'src/ciw/link_*.py'
      - 'tests/test_link*.py'
      - 'scripts/check_link_installation.py'
      - 'pyproject.toml'
      - '.github/workflows/link-pinwheel.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installed:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install 'setuptools>=77' wheel '.[dev,legibility]'
      - run: python -m pip wheel --no-deps --no-build-isolation . --wheel-dir dist
      - name: Exact-pin installed Link and pinwheel journey
        shell: bash
        run: |
          set -euo pipefail
          wheel=$(find dist -name '*.whl' -print -quit)
          python scripts/check_link_installation.py --wheel "$wheel" --output-dir "$RUNNER_TEMP/pinwheel" --require-pins --with-pinwheel
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pinwheel-${{ matrix.python }}
          path: |
            ${{ runner.temp }}/pinwheel/summary.json
            ${{ runner.temp }}/pinwheel/installed-tests.xml
            ${{ runner.temp }}/pinwheel/*.log
          retention-days: 14
