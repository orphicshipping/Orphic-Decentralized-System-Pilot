name: NISE bounded profile and NET semantic handoff
on:
  pull_request:
    paths:
      - 'src/ciw/nise_*.py'
      - 'src/ciw/semantic_capabilities.py'
      - 'src/ciw/net.py'
      - 'src/ciw/services.py'
      - 'src/ciw/principal_policy.py'
      - 'src/ciw/mcp_server.py'
      - 'tests/test_nise_*.py'
      - 'docs/NISE_*.md'
      - '.github/workflows/nise-handoff.yml'
      - 'pyproject.toml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  handoff:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: orphicsystems/Notations-Inference-Schematics-Engine
          ref: 81908ddbe817018af5d9887a6bdd9cce3e3eafc6
          path: external/nise
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]' build
      - name: Install NISE in an isolated provider environment
        shell: bash
        run: |
          python - <<'PY'
          import io, os, subprocess, tarfile, venv
          from pathlib import Path
          checkout = Path('external/nise').resolve()
          actual = subprocess.check_output(['git', '-C', str(checkout), 'rev-parse', 'HEAD'], text=True).strip()
          assert actual == '81908ddbe817018af5d9887a6bdd9cce3e3eafc6'
          target = Path(os.environ['RUNNER_TEMP']) / 'nise-provider'
          venv.EnvBuilder(with_pip=True).create(target)
          provider = target / ('Scripts/python.exe' if os.name == 'nt' else 'bin/python')
          # Build intermediates must not dirty the runtime checkout under test.
          source = Path(os.environ['RUNNER_TEMP']) / 'nise-provider-build'
          source.mkdir()
          archive = subprocess.check_output(['git', '-C', str(checkout), 'archive', 'HEAD'])
          with tarfile.open(fileobj=io.BytesIO(archive)) as tree:
              tree.extractall(source, filter='data')
          subprocess.run([str(provider), '-m', 'pip', 'install', '--no-deps', str(source)], check=True)
          assert not subprocess.check_output(['git', '-C', str(checkout), 'status', '--porcelain'])
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write('NISE_PYTHON=' + provider.as_posix() + '\n')
              env.write('CIW_NISE_PYTHON=' + provider.as_posix() + '\n')
              env.write('CIW_NISE_CHECKOUT=' + checkout.as_posix() + '\n')
          PY
      - name: Install the declared official MCP transport extra
        if: runner.os == 'Linux'
        run: python -m pip install -e '.[mcp-control]'
      - name: Bounded NISE profile, current grants and external MCP
        if: runner.os == 'Linux'
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B -m pytest -q -p no:cacheprovider tests/test_nise_contract.py tests/test_nise_profile.py tests/test_nise_policy.py --junitxml=nise-profile-tests.xml
      - name: NET handoff contract tests
        run: python -m pytest -q tests/test_nise_handoff.py tests/test_semantic_capabilities.py --junitxml=nise-handoff-tests.xml
      - name: Real NISE schematic to NET semantic compilation
        shell: bash
        run: |
          tmp="$(mktemp -d)"
          cat > "$tmp/catalog.json" <<'JSON'
          {
            "schema":"nise.system-catalog.v1",
            "catalog_id":"net-handoff-fixture",
            "nodes":[
              {"node_id":"oscillator","kind":"ENTITY","label":"Oscillator","status":"DECLARED","attributes":{},"evidence_refs":[]},
              {"node_id":"op.stats","kind":"OPERATION","label":"Statistics","status":"DECLARED","attributes":{"semantic_capability":"analysis.statistics.v1"},"evidence_refs":[]},
              {"node_id":"op.spectrum","kind":"OPERATION","label":"Spectrum","status":"DECLARED","attributes":{"semantic_capability":"analysis.spectrum.v1"},"evidence_refs":[]}
            ],
            "edges":[
              {"edge_id":"e1","source":"oscillator","target":"op.stats","relation":"inspected_by","status":"DECLARED","directional":false,"evidence_refs":[],"attributes":{}},
              {"edge_id":"e2","source":"oscillator","target":"op.spectrum","relation":"inspected_by","status":"DECLARED","directional":false,"evidence_refs":[],"attributes":{}}
            ],
            "metadata":{"scope":"synthetic NET handoff fixture"}
          }
          JSON
          cat > "$tmp/query.json" <<'JSON'
          {
            "schema":"nise.query.v1",
            "query_id":"net-handoff",
            "question":"Inspect the retained oscillator observations.",
            "focus_node_ids":["oscillator"],
            "requested_capabilities":["analysis.statistics.v1","analysis.spectrum.v1"],
            "max_hops":2,
            "node_budget":16,
            "include_hypotheses":false
          }
          JSON
          "$NISE_PYTHON" -I -B -m nise.cli compile "$tmp/catalog.json" "$tmp/query.json" --output "$tmp/schematic.json"
          python - <<'PY' "$tmp/schematic.json" "$tmp/binding.json"
          import json,sys
          s=json.load(open(sys.argv[1]))
          b={
            "schema":"ciw.nise-binding-plan.v1",
            "binding_id":"ci-handoff-001",
            "schematic_id":s["schematic_id"],
            "graph_id":"nise-net-ci",
            "model_id":"analytic-damped-oscillator.v1",
            "nodes":[
              {"nise_node_id":"op.stats","node_id":"statistics","parameters":{"channel":"q"},"inputs":{},"depends_on":[],"resources":["cpu"],"acceptance":{},"inspection":False},
              {"nise_node_id":"op.spectrum","node_id":"spectrum","parameters":{"channel":"q"},"inputs":{},"depends_on":["statistics"],"resources":["cpu"],"acceptance":{},"inspection":False}
            ]
          }
          json.dump(b,open(sys.argv[2],'w'),indent=2)
          PY
          python -m ciw.net nise compile-handoff "$tmp/schematic.json" "$tmp/binding.json" --output "$tmp/handoff.json"
          python - <<'PY' "$tmp/handoff.json"
          import json,sys
          h=json.load(open(sys.argv[1]))
          assert h["schema"]=="ciw.nise-handoff.v1"
          assert h["claims"]["execution_authority"] is False
          assert h["claims"]["engine_selected_by_nise"] is False
          assert h["provenance"] == {"validation":"structural_contract_only","source_authenticated":False,"fresh_recomputation":False}
          assert h["query_context"] == {"question":"Inspect the retained oscillator observations.","role":"inert_scoping_context","execution_instruction":False}
          assert h["semantic_compilation"]["graph"]["mandate"] != h["query_context"]["question"]
          assert [n["operation_id"] for n in h["semantic_compilation"]["experiment"]["nodes"]]==["statistics.v1","spectrum.periodogram.v1"]
          PY
      - name: Require zero failures/errors/skips
        shell: bash
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as E
          suites=list(E.parse('nise-handoff-tests.xml').getroot().iter('testsuite'))
          assert sum(int(s.attrib['tests']) for s in suites) >= 30
          assert all(int(s.attrib[k]) == 0 for s in suites for k in ('failures','errors','skipped'))
          import os
          if os.environ['RUNNER_OS'] == 'Linux':
              suites=list(E.parse('nise-profile-tests.xml').getroot().iter('testsuite'))
              assert sum(int(s.attrib['tests']) for s in suites) >= 100
              assert all(int(s.attrib[k]) == 0 for s in suites for k in ('failures','errors','skipped'))
          PY
