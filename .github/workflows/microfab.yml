name: Microfab declaration contracts

on:
  pull_request:
    paths:
      - 'src/ciw/microfab.py'
      - 'src/ciw/microfab_cli.py'
      - 'src/ciw/polymer_cli.py'
      - 'src/ciw/core/identities.py'
      - 'tests/test_microfab.py'
      - 'pyproject.toml'
      - '.github/workflows/microfab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  microfab:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -p test_microfab.py -v
      - name: Installed native CLI journey
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          net polymer microfab example --output microfab-plan.json
          net polymer microfab compile microfab-plan.json --output microfab-envelope.json
          net polymer microfab verify microfab-plan.json microfab-envelope.json
