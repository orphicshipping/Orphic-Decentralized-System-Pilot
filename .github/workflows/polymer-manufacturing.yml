name: Installed polymer manufacturing and tool-point QC

on:
  pull_request:
    paths:
      - 'src/ciw/manufacturing*.py'
      - 'src/ciw/polymer_*.py'
      - 'src/ciw/net.py'
      - 'src/ciw/core/identities.py'
      - 'tests/test_polymer_manufacturing.py'
      - 'tests/test_polymer_toolpoint_qc.py'
      - 'validation/polymer-manufacturing/**'
      - 'scripts/check_polymer_manufacturing_installed.py'
      - 'scripts/installed_command.py'
      - 'tests/test_installed_command.py'
      - 'pyproject.toml'
      - '.github/workflows/polymer-manufacturing.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Preserve exact fixture bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build actual candidate wheel
        run: python -m pip wheel --no-deps . --wheel-dir dist
      - name: Install candidate and repository-pinned test dependencies
        run: python -c "import pathlib, subprocess, sys; wheels=list(pathlib.Path('dist').glob('*.whl')); assert len(wheels)==1; subprocess.check_call([sys.executable,'-m','pip','install',str(wheels[0])+'[dev]'])"
      - name: Qualify source, isolated installed package and native commands
        run: python scripts/check_polymer_manufacturing_installed.py --wheel-dir dist --output-dir qualification-polymer-manufacturing
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: polymer-manufacturing-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            qualification-polymer-manufacturing/
            dist/*.whl
          if-no-files-found: error
